<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Перетягивание каната: счёт до 100</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&family=Russo+One&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  --bg:#e5edf0; --panel:#ffffff; --ink:#1b2833; --muted:#52616e; --line:#c4d1d9;
  --sky1:#7cc8ee; --sky2:#e3f5fb; --cloud:rgba(255,255,255,.85);
  --hill1:#b9dba0; --hill2:#9ccf9a; --ground:#ebcf93; --ground2:#d9b878; --tick:#a8813f;
  --chip:#ffffff; --chip-on:#1b2833; --chip-on-ink:#ffffff;
  --accent:#c93720; --accent-edge:#8f2512;
  --g:#0f7a3c; --b:#2349b8;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0e1726; --panel:#1a2740; --ink:#e8eef8; --muted:#9db0c9; --line:#2f4161;
    --sky1:#141d45; --sky2:#4b4a88; --cloud:rgba(255,255,255,.16);
    --hill1:#2b4160; --hill2:#25384f; --ground:#6d5b3e; --ground2:#54462f; --tick:#8d7850;
    --chip:#1a2740; --chip-on:#e8eef8; --chip-on-ink:#0e1726;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e1726; --panel:#1a2740; --ink:#e8eef8; --muted:#9db0c9; --line:#2f4161;
  --sky1:#141d45; --sky2:#4b4a88; --cloud:rgba(255,255,255,.16);
  --hill1:#2b4160; --hill2:#25384f; --ground:#6d5b3e; --ground2:#54462f; --tick:#8d7850;
  --chip:#1a2740; --chip-on:#e8eef8; --chip-on-ink:#0e1726;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;height:100%;overflow:auto;background:var(--bg);color:var(--ink);
  font-family:'Nunito',system-ui,'Segoe UI',Roboto,Arial,sans-serif;font-weight:600;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;
}
button{font-family:inherit;touch-action:manipulation}
:focus-visible{outline:3px solid #ffb703;outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.app{min-height:100%;display:flex;flex-direction:column}

/* ---------- header ---------- */
.top{display:flex;align-items:center;gap:10px 14px;padding:10px clamp(10px,2vw,20px);flex-wrap:wrap}
h1{font:400 clamp(17px,2.6vw,26px)/1.1 'Russo One','Arial Black',sans-serif;margin:0;flex:1 1 auto;min-width:0}
.stage-label{display:none;font-weight:800;font-size:14px;color:var(--muted);padding:4px 10px;border-radius:999px;border:2px solid var(--line);white-space:nowrap}
.app:not([data-phase="menu"]) .stage-label{display:inline-block}
.score{display:flex;align-items:center;gap:6px}
.pill{display:flex;align-items:center;gap:8px;padding:3px 12px;border-radius:999px;background:var(--panel);border:2px solid var(--line);font-weight:800;font-size:14px}
.pill b{font:400 20px/1 'Russo One',sans-serif;min-width:1ch;text-align:center}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.dot.g{background:var(--g)} .dot.b{background:var(--b)}
.colon{font:400 20px 'Russo One',sans-serif;color:var(--muted)}
.icon-btn{appearance:none;border:2px solid var(--line);background:var(--panel);color:var(--ink);width:42px;height:42px;border-radius:12px;display:grid;place-items:center;cursor:pointer;padding:0}
.icon-btn svg{width:22px;height:22px}
.icon-btn.txt{width:auto;padding:0 14px;font-weight:800;font-size:15px}
.app[data-phase="menu"] #menuBtn{display:none}
#sndBtn .off{display:none}
#sndBtn[aria-pressed="false"] .on{display:none}
#sndBtn[aria-pressed="false"] .off{display:block}

/* ---------- arena ---------- */
.arena{
  position:relative;height:clamp(150px,min(34vh,46vw),400px);height:clamp(150px,min(34dvh,46vw),400px);
  container-type:size;overflow:hidden;flex:none;
  background:linear-gradient(var(--sky1),var(--sky2) 74%);
}
.cloud{position:absolute;height:20px;width:84px;border-radius:99px;background:var(--cloud)}
.cloud::before,.cloud::after{content:"";position:absolute;bottom:8px;border-radius:50%;background:inherit}
.cloud::before{left:14px;width:34px;height:30px}
.cloud::after{left:40px;width:26px;height:24px}
.c1{top:9%;left:8%} .c2{top:16%;left:62%;transform:scale(.8)} .c3{top:6%;left:36%;transform:scale(.6)}
.hills{position:absolute;left:-10%;right:-10%;bottom:26%;height:28%;
  background:
   radial-gradient(ellipse 40% 100% at 24% 100%,var(--hill1) 98%,transparent 100%),
   radial-gradient(ellipse 46% 84% at 76% 100%,var(--hill2) 98%,transparent 100%)}
.ground{position:absolute;left:0;right:0;bottom:0;height:30%;background:linear-gradient(var(--ground),var(--ground2))}
.ticks{position:absolute;left:0;right:0;bottom:5%;height:4px;opacity:.55;
  background:repeating-linear-gradient(90deg,var(--tick) 0 18px,transparent 18px 46px);
  background-position-x:calc(var(--pos,0) * -8cqw / var(--goal,5));
  transition:background-position-x .55s cubic-bezier(.34,1.45,.5,1)}
.mark{position:absolute;top:0;bottom:0;width:0;border-left:3px dashed}
.mark.c{left:50%;border-color:rgba(224,64,42,.55)}
.mark.g{left:calc(50% - 8cqw);border-color:var(--g)}
.mark.b{left:calc(50% + 8cqw);border-color:var(--b)}
.mark span{position:absolute;top:6px;padding:2px 8px;border-radius:8px;color:#fff;font-weight:800;font-size:12px;white-space:nowrap}
.mark.g span{right:8px;background:var(--g)}
.mark.b span{left:8px;background:var(--b)}

.pullers{
  position:absolute;left:0;right:0;bottom:12%;z-index:2;
  display:flex;align-items:flex-end;justify-content:center;padding-inline:8cqw;
  --h:120px; --h:min(70cqh,21cqw);
  transform:translateX(calc(var(--pos,0) * -8cqw / var(--goal,5)));
  transition:transform .55s cubic-bezier(.34,1.45,.5,1);
}
.team{height:var(--h);width:auto;flex:none;position:relative;z-index:1;pointer-events:none;-webkit-user-drag:none}
#imgG{transform-origin:100% 44%}
#imgB{transform-origin:0% 44%;margin-left:-1px}
.flag{position:absolute;left:50%;bottom:calc(var(--h) * .27);z-index:2;width:clamp(12px,calc(var(--h) * .1),20px);height:calc(var(--h) * .3);
  transform:translateX(-50%);background:#e0402a;clip-path:polygon(0 0,100% 0,100% 100%,50% 80%,0 100%)}
.yank-g{animation:yankg .5s ease-out}
.yank-b{animation:yankb .5s ease-out}
@keyframes yankg{0%{transform:none}35%{transform:rotate(-1.8deg)}100%{transform:none}}
@keyframes yankb{0%{transform:none}35%{transform:rotate(1.8deg)}100%{transform:none}}
.burst{position:absolute;top:14%;z-index:5;font:400 clamp(20px,4.4cqw,42px) 'Russo One',sans-serif;pointer-events:none;
  -webkit-text-stroke:5px #fff;paint-order:stroke fill;animation:burst .95s ease-out forwards}
.burst.g{left:12%;color:var(--g)} .burst.b{right:12%;color:var(--b)}
@keyframes burst{0%{opacity:0;transform:translateY(14px) scale(.7)}25%{opacity:1;transform:translateY(0) scale(1.1)}100%{opacity:0;transform:translateY(-28px) scale(1)}}

/* ---------- setup ---------- */
.setup{flex:1;padding:clamp(12px,2vw,22px);display:flex;justify-content:center}
.app:not([data-phase="menu"]) .setup{display:none}
.setup-inner{width:100%;max-width:980px;display:grid;gap:16px;align-content:start}
.setup h2{font:400 clamp(20px,3vw,28px)/1.1 'Russo One',sans-serif;margin:0}
.lead{margin:-8px 0 0;color:var(--muted);font-weight:700}
.stages{display:grid;grid-template-columns:repeat(auto-fill,minmax(136px,1fr));gap:10px}
.stage{appearance:none;border:2px solid var(--line);background:var(--chip);color:var(--ink);border-radius:16px;padding:10px 12px;
  text-align:left;display:grid;gap:2px;cursor:pointer;min-height:66px;align-content:center}
.stage b{font:400 20px/1.1 'Russo One',sans-serif}
.stage small{font-size:12.5px;font-weight:700;color:var(--muted)}
.stage[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink);border-color:var(--chip-on)}
.stage[aria-pressed="true"] small{color:inherit;opacity:.8}
.opts{display:flex;flex-wrap:wrap;gap:14px 30px}
fieldset{border:0;padding:0;margin:0;min-width:0}
legend{font-weight:800;margin-bottom:6px;padding:0}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:14px;overflow:hidden;background:var(--chip)}
.seg button{border:0;background:transparent;color:var(--ink);font-weight:800;font-size:15px;padding:10px 16px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink)}
.btn{appearance:none;border:0;border-radius:16px;padding:14px 26px;font:400 20px/1.1 'Russo One',sans-serif;background:var(--accent);color:#fff;
  box-shadow:0 5px 0 var(--accent-edge);cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--accent-edge)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:none;border:2px solid var(--line);font:800 16px 'Nunito',sans-serif;padding:12px 20px}
.btn.ghost:active{transform:none}
.btn.link{background:transparent;color:var(--muted);box-shadow:none;font:800 15px 'Nunito',sans-serif;text-decoration:underline;padding:8px}
.btn.link:active{transform:none}
.go{justify-self:start}

/* ---------- duel / calculators ---------- */
.duel{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:clamp(12px,3vw,34px);padding:clamp(10px,2vw,20px) clamp(10px,2.4vw,28px) 26px;min-height:290px}
.app[data-phase="menu"] .duel{display:none}
@media (max-aspect-ratio:4/5){
  .duel{grid-template-columns:1fr;grid-auto-rows:minmax(300px,1fr)}
  .calc{max-width:560px;width:100%;justify-self:center}
}
.calc{
  --screen-ok:#c9f0c1;--screen-bad:#fbd6d0;
  container-type:inline-size;min-height:0;display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:10px;padding:12px 14px 14px;border-radius:26px;
  background:linear-gradient(165deg,var(--body1),var(--body2));
  box-shadow:inset 0 0 0 3px var(--rim),0 8px 0 var(--body3),0 16px 26px rgba(0,0,0,.2);
}
.calc[data-team="g"]{--body1:#128044;--body2:#0a5128;--body3:#073a1c;--rim:#f0bf2b;--screen:#e8f4d6;--sink:#0b3d20;--key:#f3faee;--kink:#0b3d20;--kedge:#a9c4a0;--eq1:#f7d457;--eq2:#e2ab12;--eqink:#4a3600;--eqedge:#a77a00}
.calc[data-team="b"]{--body1:#2650c2;--body2:#16328f;--body3:#0f2263;--rim:#c7cfdb;--screen:#e4ecfb;--sink:#0f2260;--key:#f2f5fc;--kink:#10255e;--kedge:#a9b7d8;--eq1:#f5f8fc;--eq2:#b5c1d2;--eqink:#10255e;--eqedge:#7d8ca3}
.calc-head{display:flex;justify-content:space-between;align-items:center;color:#fff;padding:0 6px;font-weight:800;font-size:clamp(14px,4cqw,17px)}
.tname{font:400 clamp(16px,5.4cqw,22px)/1 'Russo One',sans-serif}
.calc-head b{font:400 1.2em/1 'Russo One',sans-serif}
.screen{background:var(--screen);color:var(--sink);border-radius:16px;padding:10px 16px 8px;box-shadow:inset 0 3px 8px rgba(0,0,0,.2);display:grid;gap:2px;transition:background-color .2s}
.screen.ok{background:var(--screen-ok)}
.screen.bad{background:var(--screen-bad);animation:shake .38s}
.expr{font:400 clamp(24px,10cqw,52px)/1.1 'Russo One',sans-serif;text-align:right;white-space:nowrap}
.ans{font:400 clamp(30px,13cqw,64px)/1.1 'Russo One',sans-serif;text-align:right;min-height:1.15em;border-top:2px dashed rgba(0,0,0,.25);padding-top:2px;white-space:nowrap}
.ans .ph{opacity:.3}
.caret{display:inline-block;width:.07em;height:.82em;background:currentColor;margin-left:.07em;vertical-align:-.06em;animation:blink 1s steps(1) infinite}
.msg{min-height:1.4em;text-align:right;font-weight:800;font-size:clamp(13px,4cqw,17px)}
.screen.ok .msg{color:#0b5a24} .screen.bad .msg{color:#9b1c14}
@keyframes blink{50%{opacity:0}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.keys{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,minmax(40px,1fr));gap:clamp(6px,2cqw,10px);min-height:0;transition:opacity .2s}
.calc.locked .keys{opacity:.55}
.key{appearance:none;border:0;border-radius:14px;background:var(--key);color:var(--kink);box-shadow:0 5px 0 var(--kedge);
  font:400 clamp(22px,8cqw,40px)/1 'Russo One',sans-serif;cursor:pointer;display:grid;place-items:center;padding:0;min-height:0}
.key:active{transform:translateY(3px);box-shadow:0 2px 0 var(--kedge)}
.key svg{width:1em;height:1em}
.k-7{grid-area:1/1}.k-8{grid-area:1/2}.k-9{grid-area:1/3}.k-bs{grid-area:4/3;background:#d7dfe8;color:#26333f;box-shadow:0 5px 0 #98a6b5}
.k-4{grid-area:2/1}.k-5{grid-area:2/2}.k-6{grid-area:2/3}
.k-1{grid-area:3/1}.k-2{grid-area:3/2}.k-3{grid-area:3/3}
.k-c{grid-area:4/1;background:#f6c9c1;color:#7a1d12;box-shadow:0 5px 0 #c98c82}
.k-0{grid-area:4/2}

/* ---------- overlays ---------- */
.count{position:fixed;inset:0;display:none;place-items:center;pointer-events:none;z-index:15}
.app[data-phase="count"] .count{display:grid}
.count span{font:400 clamp(90px,24vw,240px)/1 'Russo One',sans-serif;color:#fff;-webkit-text-stroke:10px #c93720;paint-order:stroke fill;
  text-shadow:0 10px 30px rgba(0,0,0,.35);animation:pop .7s ease-out}
.count span.word{font-size:clamp(60px,16vw,170px)}
@keyframes pop{0%{transform:scale(.4);opacity:0}35%{transform:scale(1.15);opacity:1}100%{transform:scale(1);opacity:1}}
.result{position:fixed;inset:0;display:none;place-items:center;background:rgba(8,16,30,.55);padding:16px;z-index:20;overflow:auto}
.app[data-phase="result"] .result{display:grid}
.card{width:100%;max-width:500px;background:var(--panel);border-radius:28px;padding:20px 22px 18px;text-align:center;border-top:12px solid var(--win,#888);
  box-shadow:0 20px 50px rgba(0,0,0,.35);display:grid;gap:12px;justify-items:center}
.card img{width:min(100%,340px);height:auto;aspect-ratio:1.5/1;object-fit:cover}
.card h2{font:400 clamp(24px,5vw,32px)/1.1 'Russo One',sans-serif;margin:0}
.stats{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;color:var(--muted);font-weight:800}
.stats span{display:flex;align-items:center;gap:6px}
.stats b{font:400 20px 'Russo One',sans-serif;color:var(--ink)}
.card .btn{width:100%}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:30}
.confetti i{position:absolute;top:-16px;width:var(--w);height:calc(var(--w) * 1.5);background:var(--c);border-radius:2px;animation:fall var(--t) linear forwards}
@keyframes fall{to{transform:translate(var(--x),110vh) rotate(var(--r))}}

@media (max-height:480px){
  .top{padding-top:6px;padding-bottom:6px}
  .arena{height:128px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .confetti{display:none}
}
</style>
</head>
<body>
<main class="app" id="app" data-phase="menu">
  <header class="top">
    <h1>Перетягивание каната</h1>
    <span class="stage-label" id="stageLabel"></span>
    <div class="score" aria-label="Счёт побед">
      <span class="pill"><i class="dot g"></i>Батыры <b id="winG">0</b></span>
      <span class="colon">:</span>
      <span class="pill"><b id="winB">0</b>Барсы <i class="dot b"></i></span>
    </div>
    <button class="icon-btn" id="sndBtn" type="button" aria-pressed="true" aria-label="Звук" title="Звук">
      <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/></svg>
      <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6m0-6l-5 6"/></svg>
    </button>
    <button class="icon-btn txt" id="menuBtn" type="button">Этапы</button>
  </header>

  <section class="arena" id="arena" aria-label="Перетягивание каната">
    <i class="cloud c1"></i><i class="cloud c2"></i><i class="cloud c3"></i>
    <div class="hills"></div>
    <div class="ground"></div>
    <div class="ticks"></div>
    <div class="mark g"><span>Батыры</span></div>
    <div class="mark c"></div>
    <div class="mark b"><span>Барсы</span></div>
    <div class="pullers" id="pullers">
      <img class="team" id="imgG" alt="Команда Батыры тянет канат" draggable="false">
      <img class="team" id="imgB" alt="Команда Барсы тянет канат" draggable="false">
      <i class="flag"></i>
    </div>
  </section>
  <p class="sr" id="status" aria-live="polite"></p>

  <section class="setup" id="setup">
    <div class="setup-inner">
      <h2>Выбери этап</h2>
      <p class="lead">Каждая команда решает свои примеры. Набери ответ цифрами, и он проверится сам. Кто ответил верно, тот тянет канат к себе.</p>
      <div class="stages" id="stages"></div>
      <div class="opts">
        <fieldset><legend>Действия</legend>
          <div class="seg" id="segOps">
            <button type="button" data-v="both">Сложение и вычитание</button>
            <button type="button" data-v="+">Сложение</button>
            <button type="button" data-v="-">Вычитание</button>
          </div>
        </fieldset>
        <fieldset><legend>Рывков до победы</legend>
          <div class="seg" id="segGoal">
            <button type="button" data-v="3">3</button>
            <button type="button" data-v="5">5</button>
            <button type="button" data-v="7">7</button>
          </div>
        </fieldset>
      </div>
      <button class="btn go" id="startBtn" type="button">Начать игру</button>
    </div>
  </section>

  <section class="duel" id="duel" aria-label="Калькуляторы команд"></section>

  <div class="count" id="count" aria-live="assertive"><span id="countN"></span></div>

  <div class="result" id="result" role="dialog" aria-modal="true" aria-labelledby="resTitle">
    <div class="card" id="card">
      <img id="resImg" alt="">
      <h2 id="resTitle"></h2>
      <div class="stats" id="resStats"></div>
      <button class="btn" id="nextBtn" type="button"></button>
      <button class="btn ghost" id="againBtn" type="button">Сыграть этот этап ещё раз</button>
      <button class="btn link" id="toMenuBtn" type="button">Выбрать другой этап</button>
    </div>
  </div>
</main>

<script>
(function(){

    var t=ac.currentTime+(when||0),o=ac.createOscillator(),g=ac.createGain();
    o.type=type||'sine';o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol||.08,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.03);
  }catch(e){}
}
var sfx={
  ok:function(){tone(660,.1,'triangle');tone(880,.18,'triangle',.08,.09)},
  bad:function(){tone(170,.28,'sawtooth',.05)},
  tick:function(){tone(520,.09,'sine',.07)},
  go:function(){tone(784,.3,'triangle',.09)},
  win:function(){[523,659,784,1047].forEach(function(f,i){tone(f,.28,'triangle',.08,i*.12)})}
};

/* ---- example generator ---- */
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function cross(a,b,op){return op==='+'?(a%10)+(b%10)>=10:(a%10)<(b%10)}
function pairs(ra,rb,ok){var o=[];for(var a=ra[0];a<=ra[1];a++)for(var b=rb[0];b<=rb[1];b++)if(ok(a,b))o.push([a,b]);return o}
var pools={};
function getPool(st,op){
  var key=st.id+op;if(pools[key])return pools[key];
  var P=op==='+',B;
  if(st.kind==='ten'){
    B=[[1,P?pairs([1,9],[1,9],function(a,b){return a+b<=10}):pairs([2,10],[1,10],function(a,b){return b<=a})]];
  }else if(st.kind==='t20a'){
    B=[[1,P?pairs([1,19],[1,19],function(a,b){var s=a+b;return s>=11&&s<=20&&!cross(a,b,'+')})
            :pairs([11,20],[1,19],function(a,b){return b<a&&!cross(a,b,'-')})]];
  }else if(st.kind==='t20b'){
    B=[[1,P?pairs([2,19],[2,19],function(a,b){var s=a+b;return s>=11&&s<=20&&cross(a,b,'+')})
            :pairs([11,20],[1,9],function(a,b){return cross(a,b,'-')})]];
  }else{
    var M=st.max,lo=Math.max(M-19,21);
    if(P){
      var okp=function(a,b){var s=a+b;return s>=lo&&s<=M};
      B=[[35,pairs([10,M],[1,9],okp)],
         [25,pairs([1,M],[10,M-1],function(a,b){return b%10===0&&a%10!==0&&okp(a,b)})],
         [40,pairs([11,M],[11,M],function(a,b){return a%10!==0&&b%10!==0&&okp(a,b)})]];
    }else{
      B=[[35,pairs([lo,M],[1,9],function(){return true})],
         [25,pairs([lo,M],[10,M-1],function(a,b){return b%10===0&&b<a&&a%10!==0})],
         [40,pairs([lo,M],[11,M-1],function(a,b){return b<a&&a%10!==0&&b%10!==0})]];
    }
  }
  B=B.filter(function(x){return x[1].length>0});
  pools[key]=B;return B;
}
function makeExample(avoid){
  var st=STAGES[state.stage],last=null;
  for(var i=0;i<14;i++){
    var op=state.ops==='both'?(Math.random()<.5?'+':'-'):state.ops;
    var B=getPool(st,op),tot=0,k;
    for(k=0;k<B.length;k++)tot+=B[k][0];
    var r=Math.random()*tot,ch=B[0];
    for(k=0;k<B.length;k++){r-=B[k][0];if(r<0){ch=B[k];break}}
    var p=ch[1][rnd(0,ch[1].length-1)];
    var ex={a:p[0],b:p[1],op:op,text:p[0]+' '+(op==='+'?'+':'\u2212')+' '+p[1],ans:op==='+'?p[0]+p[1]:p[0]-p[1]};
    last=ex;
    if(avoid.indexOf(ex.text)===-1)return ex;
  }
  return last;
}
function newExample(t){
  var o=t==='g'?'b':'g',avoid=[];
  if(state.teams[t].ex)avoid.push(state.teams[t].ex.text);
  if(state.teams[o].ex)avoid.push(state.teams[o].ex.text);
  return makeExample(avoid);
}

/* ---- DOM ---- */
var app=$('#app'),arena=$('#arena'),duel=$('#duel'),statusEl=$('#status');
$('#imgG').src=IMG.g;$('#imgB').src=IMG.b;
var BS='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M9 5h11a1 1 0 011 1v12a1 1 0 01-1 1H9l-6-7 6-7z"/><path d="M12.5 9.5l5 5m0-5l-5 5"/></svg>';
function calcHTML(t){
  var keys=['7','8','9','4','5','6','1','2','3','c','0','bs'];
  var lab={bs:'Стереть',c:'Очистить'},inner={bs:BS,c:'C'};
  return '<div class="calc locked" data-team="'+t+'" role="group" aria-label="Калькулятор: '+TEAMS[t].name+'">'+
    '<div class="calc-head"><span class="tname">'+TEAMS[t].name+'</span><span>Верно: <b class="cnt">0</b></span></div>'+
    '<div class="screen"><div class="expr"></div><div class="ans"></div><div class="msg" aria-live="polite"></div></div>'+
    '<div class="keys">'+keys.map(function(k){
      return '<button type="button" class="key k-'+k+'" data-k="'+k+'"'+(lab[k]?' aria-label="'+lab[k]+'"':'')+'>'+(inner[k]||k)+'</button>';
    }).join('')+'</div></div>';
}
duel.innerHTML=calcHTML('g')+calcHTML('b');
function el(t){return $('.calc[data-team="'+t+'"]',duel)}

function renderCalc(t){
  var T=state.teams[t],c=el(t);
  $('.expr',c).textContent=T.ex?T.ex.text+' =':'';
  $('.ans',c).innerHTML=(T.input===''?'<span class="ph">?</span>':T.input)+'<i class="caret"></i>';
  c.classList.toggle('locked',T.locked);
}
function setMsg(t,text,cls){
  var s=$('.screen',el(t));
  $('.msg',s).textContent=text||'';
  s.classList.remove('ok','bad');
  if(cls){void s.offsetWidth;s.classList.add(cls)}
}
function updateCounts(){
  ['g','b'].forEach(function(t){$('.cnt',el(t)).textContent=state.correct[t]});
  $('#winG').textContent=state.wins.g;$('#winB').textContent=state.wins.b;
}
function setArena(){arena.style.setProperty('--pos',state.pos);arena.style.setProperty('--goal',state.goal)}
function setPhase(p){state.phase=p;app.dataset.phase=p}
function later(ms,fn){var tk=state.token;setTimeout(function(){if(tk===state.token)fn()},ms)}

/* ---- menu ---- */
function buildStages(){
  var h='';
  STAGES.forEach(function(s,i){
    h+='<button type="button" class="stage" data-i="'+i+'" aria-pressed="'+(i===state.stage)+'"><b>'+s.title+'</b><small>'+s.sub+'</small></button>';
  });
  $('#stages').innerHTML=h;
}
function syncMenu(){
  Array.prototype.forEach.call($('#stages').children,function(b,i){b.setAttribute('aria-pressed',i===state.stage)});
  Array.prototype.forEach.call($('#segOps').children,function(b){b.setAttribute('aria-pressed',b.dataset.v===state.ops)});
  Array.prototype.forEach.call($('#segGoal').children,function(b){b.setAttribute('aria-pressed',Number(b.dataset.v)===state.goal)});
  $('#sndBtn').setAttribute('aria-pressed',state.sound);
  setArena();
}
$('#stages').addEventListener('click',function(e){var b=e.target.closest('.stage');if(!b)return;state.stage=+b.dataset.i;save();syncMenu()});
$('#segOps').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;state.ops=b.dataset.v;save();syncMenu()});
$('#segGoal').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;state.goal=+b.dataset.v;save();syncMenu()});
$('#sndBtn').addEventListener('click',function(){state.sound=!state.sound;save();syncMenu()});
function toMenu(){
  state.token++;state.pos=0;
  $('#result').scrollTop=0;
  setPhase('menu');syncMenu();
  statusEl.textContent='';
}
$('#menuBtn').addEventListener('click',toMenu);
$('#toMenuBtn').addEventListener('click',toMenu);

/* ---- game ---- */
function start(){
  state.token++;
  var tk=state.token;
  state.pos=0;state.correct={g:0,b:0};
  state.teams.g={ex:null,input:'',locked:true};
  state.teams.b={ex:null,input:'',locked:true};
  state.teams.g.ex=newExample('g');
  state.teams.b.ex=newExample('b');
  ['g','b'].forEach(function(t){renderCalc(t);setMsg(t,'','')});
  updateCounts();setArena();
  $('#stageLabel').textContent=STAGES[state.stage].label;
  setPhase('count');
  var seq=['3','2','1','Тяни!'],i=0,n=$('#countN');
  (function step(){
    if(tk!==state.token)return;
    if(i>=seq.length){
      setPhase('play');
      ['g','b'].forEach(function(t){state.teams[t].locked=false;renderCalc(t)});
      return;
    }
    n.className=i===3?'word':'';
    n.textContent=seq[i];
    var s=n.cloneNode(true);n.parentNode.replaceChild(s,n);n=s;n.id='countN';
    if(i===3)sfx.go();else sfx.tick();
    i++;setTimeout(step,i===4?650:750);
  })();
}
$('#startBtn').addEventListener('click',start);
$('#againBtn').addEventListener('click',function(){clearConfetti();start()});
$('#nextBtn').addEventListener('click',function(){
  clearConfetti();
  if(state.stage<STAGES.length-1)state.stage++;
  save();start();
});

duel.addEventListener('click',function(e){
  var k=e.target.closest('.key');if(!k)return;
  press(k.closest('.calc').dataset.team,k.dataset.k);
});
function press(t,k){
  if(state.phase!=='play')return;
  var T=state.teams[t];if(T.locked)return;
  if(k==='c')T.input='';
  else if(k==='bs')T.input=T.input.slice(0,-1);
  else{if(T.input.length>=3)return;T.input=(T.input==='0'?k:T.input+k)}
  setMsg(t,'','');renderCalc(t);
  if(k!=='c'&&k!=='bs'&&T.input.length===String(T.ex.ans).length)submit(t);
}
function submit(t){
  var T=state.teams[t];
  if(T.input===''){setMsg(t,'Введи ответ','');return}
  if(Number(T.input)===T.ex.ans)onCorrect(t);else onWrong(t);
}
function onWrong(t){
  var T=state.teams[t];T.locked=true;renderCalc(t);
  setMsg(t,'Не то. Подумай ещё','bad');sfx.bad();
  later(1100,function(){T.input='';T.locked=false;setMsg(t,'','');renderCalc(t)});
}
function onCorrect(t){
  var T=state.teams[t];T.locked=true;renderCalc(t);
  state.correct[t]++;updateCounts();
  setMsg(t,'Верно! Тяни!','ok');sfx.ok();
  state.pos+=t==='g'?1:-1;
  setArena();pullFx(t);
  var lead=Math.abs(state.pos);
  statusEl.textContent=TEAMS[t].name+' тянут. Перевес: '+lead+' из '+state.goal;
  if(lead>=state.goal){
    setPhase('result-wait');
    later(950,function(){finish(t)});
    return;
  }
  later(700,function(){
    T.ex=newExample(t);T.input='';T.locked=false;
    setMsg(t,'','');renderCalc(t);
  });
}
function pullFx(t){
  var img=$(t==='g'?'#imgG':'#imgB'),cls='yank-'+t;
  img.classList.remove(cls);void img.offsetWidth;img.classList.add(cls);
  var b=document.createElement('span');b.className='burst '+t;b.textContent='Рывок!';
  b.addEventListener('animationend',function(){b.remove()});
  arena.appendChild(b);
}
function finish(t){
  state.wins[t]++;updateCounts();
  var T=TEAMS[t],card=$('#card');
  card.style.setProperty('--win',T.color);
  $('#resImg').src=IMG[t];$('#resImg').style.objectPosition=t==='g'?'left center':'right center';$('#resImg').alt='Команда: '+T.name;
  $('#resTitle').textContent=T.title;
  $('#resStats').innerHTML=
    '<span><i class="dot g"></i>Батыры, верных ответов: <b>'+state.correct.g+'</b></span>'+
    '<span><i class="dot b"></i>Барсы, верных ответов: <b>'+state.correct.b+'</b></span>';
  var hasNext=state.stage<STAGES.length-1,nb=$('#nextBtn');
  nb.textContent=hasNext?'Дальше: '+STAGES[state.stage+1].label:'Сыграть ещё раз';
  nb.onclick=null;
  nb.dataset.next=hasNext?'1':'0';
  $('#againBtn').style.display=hasNext?'':'none';
  setPhase('result');sfx.win();confetti(t);
  nb.focus({preventScroll:true});
}
function confetti(t){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  var box=document.createElement('div');box.className='confetti';box.id='confetti';
  var cols=TEAMS[t].confetti,h='';
  for(var i=0;i<46;i++){
    h+='<i style="left:'+rnd(0,100)+'%;--w:'+rnd(7,12)+'px;--c:'+cols[rnd(0,cols.length-1)]+
       ';--t:'+(2.2+Math.random()*2).toFixed(2)+'s;--x:'+rnd(-90,90)+'px;--r:'+rnd(200,900)+'deg;animation-delay:'+(Math.random()*.6).toFixed(2)+'s"></i>';
  }
  box.innerHTML=h;document.body.appendChild(box);
  setTimeout(clearConfetti,5000);
}
function clearConfetti(){var c=$('#confetti');if(c)c.remove()}

/* "Дальше" works also when no next stage exists: just replay */
$('#nextBtn').addEventListener('click',function(){},false);

buildStages();syncMenu();
renderCalc('g');renderCalc('b');
})();
</script>
</body>
